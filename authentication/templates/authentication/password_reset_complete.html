{% extends "authentication/layout.html" %}
{% block body %}

<main class="form-signin w-100 m-auto">
  <div class="card shadow-sm p-4">
    <h1 class="text-center mb-3">Password Reset Complete</h1>

    <div class="text-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="text-success mb-3" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>

      <p class="text-body-secondary">
        Your password has been successfully reset.
      </p>
    </div>

    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2">Sign In</a>
  </div>
</main>

{% endblock %}
