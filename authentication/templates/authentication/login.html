{% extends "authentication/layout.html" %}
{% block body %}

    <main class="form-signin w-100 m-auto">
      <div class="card shadow-sm p-4">
        <h1 class="text-center mb-3">Django Apps</h1>

        <form action="{% url 'login' %}" method="post">
          {% csrf_token %}
          <p class="fw-normal text-center text-body-secondary">Please sign in</p>

          {% if login_message %}
          <div class="alert alert-danger py-2 text-center" role="alert">
            {{ login_message }}
          </div>
          {% endif %}

          <div class="form-floating mb-2">
            <input type="text" class="form-control {% if login_message %}is-invalid{% endif %}" id="floatingInput" placeholder="username" name="floatingInput_name">
            <label for="floatingInput">User Name</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" class="form-control {% if login_message %}is-invalid{% endif %}" id="floatingPassword" placeholder="Password" name="floatingPassword_name">
            <label for="floatingPassword">Password</label>
          </div>
          <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
        </form>

        <hr>

        <button type="button" class="btn btn-outline-success w-100 py-2" data-bs-toggle="modal" data-bs-target="#credentialsModal">
          See Demo Credentials
        </button>

        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>
      <div class="text-center mt-3">
        <a href="https://github.com/kotebeg/django_deployment_pyanywharee" class="text-body-secondary text-decoration-none" target="_blank">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-1" viewBox="0 0 16 16">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          <small>View on GitHub</small>
        </a>
      </div>
      </div>

      <!-- Credentials Modal -->
      <div class="modal fade" id="credentialsModal" tabindex="-1" aria-labelledby="credentialsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="credentialsModalLabel">Demo Credentials</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p class="mb-1"><strong>User Name:</strong> visitor</p>
              <p class="mb-0"><strong>Password:</strong> tester123</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-primary" onclick="fillupCredentials()">Paste Credentials</button>
            </div>
          </div>
        </div>
      </div>

    </main>

{% endblock %}
